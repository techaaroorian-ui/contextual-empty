name: Package release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify packages without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm ci
      - name: Validate pending change records
        run: npm run changeset:status
      - name: Verify release contents
        run: npm run release:check
      - name: Publish reviewed versions
        if: ${{ !inputs.dry_run }}
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
